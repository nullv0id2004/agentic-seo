name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: seo_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: P1 import lint (collectors never import an LLM SDK; analysts never import a network client)
        run: python scripts/lint_imports.py
      - run: ruff check .
      - run: pytest
        env:
          SEO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seo_test
      - name: Adversarial eval suite (Section 14)
        run: python evals/run_evals.py
  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck

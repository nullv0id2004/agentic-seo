[project]
name = "seo-agents"
version = "0.1.0"
description = "Multi-project agentic SEO system: deterministic collectors, tool-less LLM analysts, two-stage gate, approval-only execution."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
    "selectolax>=0.3",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["analysts", "collectors", "config", "contracts", "db", "executors", "gate", "llm", "orchestrator", "orchestrator.graphs", "rules", "evals", "evals.adversarial"]
include-package-data = true

[tool.setuptools.package-data]
db = ["migrations/*.sql"]
config = ["projects/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["."]
addopts = "-q"
markers = ["db: requires a live Postgres (set SEO_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "console", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

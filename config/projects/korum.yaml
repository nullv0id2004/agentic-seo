slug: korum
display_name: KORUM
vertical: recruitment
domains: [korum.worldhire.com]
gsc_property: sc-domain:korum.worldhire.com
ga4_property_id: '546390504'
credentials_ref: gsc-korum-service-account
github_repo: nullv0id2004/Worldhire2.0-1-
cms_publish_url: null
approver_id: 93a8539c-c38d-427a-86af-150fbdb5539a
monthly_cost_cap_usd: 50
monthly_content_cap: 4
# Tracked keywords whose Google rank is checked every day (06:15 IST); mapped keywords first, then by volume.
rank_tracking_limit: 25
# offpage (outreach pitch drafts) back on since 2026-10-25, matching production. Each pitch waits in the console for
# approval and a recipient; sending also needs the outreach-smtp secret in Key Vault.
enabled_agents: [technical, keyword, onpage, content, offpage, trend, linkbuilding, report]
# JobPosting is intended (owner's decision, 2026-10-23): the job pages are in the sitemap for Google for Jobs.
allowed_schema_types: [Organization, WebSite, Article, FAQPage, BreadcrumbList, JobPosting]
critical_paths: [/dashboard, /dashboard/, /recruiter, /recruiter/, /recruiter/inbox, /recruiter/jobs, /admin, /admin/, /api/health]
critical_rules:
  - key: no_indexable_auth_route
    url_pattern: '^/(dashboard|recruiter|admin|api)(/|$)'
    assertion: must_noindex
  - key: auth_routes_absent_from_sitemap
    url_pattern: '^/(dashboard|recruiter|admin)(/|$)'
    assertion: must_not_appear_in_sitemap
brand_rules:
  - {type: char_ban,      pattern: '—',                                   severity: block, rationale: 'no em dashes'}
  - {type: banned_phrase, pattern: '(curated|hand-picked|AI-powered)',    severity: block}
  - {type: banned_phrase, pattern: '\bCandidate\b',                       severity: block, rationale: 'use Job Seeker on public pages'}
  - {type: regex,         pattern: 'you[^.]{0,40}(cheap|invisible|exposed)', severity: block}
# From the site's own llms.txt. The keyword analyst judges relevance against this.
description: >-
  KORUM is a confidential, consent-led hiring platform where senior professionals stay private and verified
  recruiters connect only with permission. Professionals choose a discoverable or confidential (masked) profile;
  recruiters express interest and the professional approves before any conversation. For senior, specialist and
  hard-to-fill talent and the recruiters and companies hiring them, in India, the UK and the US.
# Seeds describe that niche; broad job-board searches ("jobs near me", government jobs) are not KORUM's market.
keyword_seeds: [confidential job search, executive job search, senior professional jobs, anonymous job search, executive search firm, headhunter for senior roles, job search while employed, confidential hiring platform, recruiter platform for senior talent]
# "KORUM" is also a fishing tackle brand and an Indian election app. These terms tell AI answers about this site apart.
brand_context_terms: [WorldHire, job, hiring, recruit, employer, job seeker]
# Job platforms KORUM competes with in India. Keyword discovery reads what they rank for; pitches never go to them.
competitors: [naukri.com, linkedin.com, indeed.com, foundit.in, glassdoor.co.in, apna.co, instahyre.com, iimjobs.com, hirist.tech, cutshort.io, shine.com, wellfound.com]
cross_link_exclusions: [worldhire]
# Where KORUM should have a presence, one name everywhere. A profile is done when the site's Organization schema
# lists it in sameAs; a directory or review site is done when it lists or links to the site. Lower priority first.
link_targets:
  - {platform: LinkedIn, domain: linkedin.com, kind: profile, priority: 10}
  - {platform: Crunchbase, domain: crunchbase.com, kind: profile, priority: 20}
  - {platform: Wellfound, domain: wellfound.com, kind: profile, priority: 30}
  - {platform: Product Hunt, domain: producthunt.com, kind: profile, priority: 40}
  - {platform: X, domain: x.com, kind: profile, priority: 50}
  - {platform: YouTube, domain: youtube.com, kind: profile, priority: 60}
  - {platform: Instagram, domain: instagram.com, kind: profile, priority: 70}
  - {platform: Facebook, domain: facebook.com, kind: profile, priority: 80}
  - {platform: Medium, domain: medium.com, kind: profile, priority: 90}
  - {platform: Wikidata, domain: wikidata.org, kind: profile, priority: 100, note: 'Only once KORUM has independent press coverage; Wikidata removes entries for organisations that are not notable.'}
  - {platform: G2, domain: g2.com, kind: review, priority: 20}
  - {platform: Capterra, domain: capterra.com, kind: review, priority: 30}
  - {platform: AmbitionBox, domain: ambitionbox.com, kind: review, priority: 40}
  - {platform: SaaSworthy, domain: saasworthy.com, kind: directory, priority: 50}
  - {platform: AlternativeTo, domain: alternativeto.net, kind: directory, priority: 60}
  - {platform: Trustpilot, domain: trustpilot.com, kind: review, priority: 60}
  - {platform: Tracxn, domain: tracxn.com, kind: directory, priority: 70}
  - {platform: Startup India, domain: startupindia.gov.in, kind: directory, priority: 80, note: 'The listing needs DPIIT recognition first.'}

slug: worldhire
display_name: WorldHire
vertical: recruitment
domains: [worldhire.com, www.worldhire.com]
gsc_property: sc-domain:worldhire.com
ga4_property_id: null
credentials_ref: gsc-worldhire-service-account
github_repo: worldhire/worldhire-web
cms_publish_url: null
approver_id: 00000000-0000-4000-8000-000000000001
monthly_cost_cap_usd: 50
monthly_content_cap: 4
enabled_agents: [technical, keyword, onpage, content, offpage, trend, report]
allowed_schema_types: [Organization, WebSite, Article, FAQPage, BreadcrumbList, JobPosting]
critical_paths: [/dashboard/, /recruiter/, /admin/]
critical_rules:
  - key: no_indexable_auth_route
    url_pattern: '^/(dashboard|recruiter|admin|api)/'
    assertion: must_noindex
  - key: auth_routes_absent_from_sitemap
    url_pattern: '^/(dashboard|recruiter|admin)/'
    assertion: must_not_appear_in_sitemap
brand_rules:
  - {type: char_ban,      pattern: '—',                                   severity: block, rationale: 'no em dashes'}
  - {type: banned_phrase, pattern: '(curated|hand-picked|AI-powered)',    severity: block}
  - {type: banned_phrase, pattern: '\bCandidate\b',                       severity: block, rationale: 'use Job Seeker on public pages'}
  - {type: regex,         pattern: 'you[^.]{0,40}(cheap|invisible|exposed)', severity: block}
keyword_seeds: [global hiring, remote recruitment agency, international recruitment]
cross_link_exclusions: [korum]

slug: worldhire
display_name: WorldHire
vertical: recruitment
domains: [worldhire.com, www.worldhire.com]
gsc_property: sc-domain:worldhire.com
ga4_property_id: '546390504'   # one GA4 stream for worldhire.com and korum.worldhire.com; the collector filters by host
credentials_ref: gsc-worldhire-service-account
# worldhire.com is served by Worldhire-Products/worldhire-landing since the 21 Oct split. Fix PRs are off for now
# (owner's decision, 2026-10-25): no github_repo, so issues keep their fix text and no PR approvals are queued.
github_repo: null
cms_publish_url: null
approver_id: 00000000-0000-4000-8000-000000000001
monthly_cost_cap_usd: 50
monthly_content_cap: 4
# worldhire.com is the marketing site and blog (services, industries, about, legal, blog); korum.worldhire.com serves
# only the job platform and 308s its old marketing paths here. Full SEO since 2026-10-25 (owner's decision); this
# replaces the 13 Oct measure-only plan, which assumed the move would go the other way. No content drafts or outreach.
enabled_agents: [technical, keyword, onpage, trend, linkbuilding, report]
description: >-
  WorldHire supports global hiring, specialist recruitment and executive search for businesses that need professionals
  and leaders across markets. Services: global hiring, executive search, specialist hiring, market mapping and embedded
  search. Its job platform for confidential senior hiring is KORUM (korum.worldhire.com).
# Recruitment and executive-search firms competing for the same searches: keyword gap, backlink gap, competitor overview
competitors: [michaelpage.co.in, randstad.in, hays.co.in, kornferry.com, spencerstuart.com, egonzehnder.com, heidrick.com, abcconsultants.in]
allowed_schema_types: [Organization, WebSite, Article, FAQPage, BreadcrumbList, JobPosting]
critical_paths: [/dashboard/, /recruiter/, /admin/]
critical_rules:
  - key: no_indexable_auth_route
    url_pattern: '^/(dashboard|recruiter|admin|api)(/|$)'
    assertion: must_noindex
  - key: auth_routes_absent_from_sitemap
    url_pattern: '^/(dashboard|recruiter|admin)(/|$)'
    assertion: must_not_appear_in_sitemap
brand_rules:
  - {type: char_ban,      pattern: '—',                                   severity: block, rationale: 'no em dashes'}
  - {type: banned_phrase, pattern: '(curated|hand-picked|AI-powered)',    severity: block}
  - {type: banned_phrase, pattern: '\bCandidate\b',                       severity: block, rationale: 'use Job Seeker on public pages'}
  - {type: regex,         pattern: 'you[^.]{0,40}(cheap|invisible|exposed)', severity: block}
keyword_seeds: [global hiring, executive search, specialist recruitment, remote recruitment agency, international recruitment]
cross_link_exclusions: [korum]
